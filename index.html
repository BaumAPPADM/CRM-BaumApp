<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23002E2B'/%3E%3Cpath d='M9 22V10l14 6z' fill='%2312A195'/%3E%3C/svg%3E">
<title>BLUM CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#EEF3F2; --line:#DCE5E3; --line-2:#C8D5D2;
  --ink:#0E2523; --ink-2:#3F5552; --muted:#6B7F7C;
  --brand:#002E2B; --brand-ink:#FFFFFF; --accent:#12A195; --accent-soft:#DDF3F0;
  --directo:#12A195; --directo-soft:#DDF3F0;
  --vendedor:#C27A1A; --vendedor-soft:#FBEBD4;
  --partner:#4F63CF; --partner-soft:#E3E7FB;
  --bad:#CF3F3F; --bad-soft:#FBE3E3; --warn:#B7791F; --warn-soft:#FCEFD6; --ok:#1E8E5E; --ok-soft:#DCF2E6;
  --s1:#A9C3BF; --s2:#80B3AC; --s3:#5AA49B; --s4:#36968B; --s5:#1F877A; --s6:#15786B; --s7:#0C5F54;
  --shadow:0 1px 2px rgba(0,46,43,.06),0 4px 14px rgba(0,46,43,.06);
  --radius:12px;
  --logo-f:none;
  --font:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B1716; --surface:#12211F; --surface-2:#182B29; --line:#243836; --line-2:#2F4744;
  --ink:#E6F0EE; --ink-2:#B5C7C4; --muted:#86A09C;
  --brand:#0B3F3A; --brand-ink:#E6F0EE; --accent:#3CC4B6; --accent-soft:#143A36;
  --directo:#3CC4B6; --directo-soft:#143A36;
  --vendedor:#E6A553; --vendedor-soft:#3A2B16;
  --partner:#8C9BF0; --partner-soft:#232A4D;
  --bad:#F07575; --bad-soft:#3F1E1E; --warn:#E8B45A; --warn-soft:#3A2F17; --ok:#5FCB97; --ok-soft:#173327;
  --s1:#4E6663; --s2:#4E8A83; --s3:#3A9A8E; --s4:#35B5A6; --s5:#4CC4B5; --s6:#6FD3C6; --s7:#9FE5DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --logo-f:brightness(0) invert(1);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1716; --surface:#12211F; --surface-2:#182B29; --line:#243836; --line-2:#2F4744;
  --ink:#E6F0EE; --ink-2:#B5C7C4; --muted:#86A09C;
  --brand:#0B3F3A; --brand-ink:#E6F0EE; --accent:#3CC4B6; --accent-soft:#143A36;
  --directo:#3CC4B6; --directo-soft:#143A36;
  --vendedor:#E6A553; --vendedor-soft:#3A2B16;
  --partner:#8C9BF0; --partner-soft:#232A4D;
  --bad:#F07575; --bad-soft:#3F1E1E; --warn:#E8B45A; --warn-soft:#3A2F17; --ok:#5FCB97; --ok-soft:#173327;
  --s1:#4E6663; --s2:#4E8A83; --s3:#3A9A8E; --s4:#35B5A6; --s5:#4CC4B5; --s6:#6FD3C6; --s7:#9FE5DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --logo-f:brightness(0) invert(1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:var(--sw,220px) 1fr;min-height:100%}
.app.collapsed{--sw:64px}
.app>.main{grid-column:2}
.side{transition:width .15s ease}
.app.collapsed .side{width:64px;padding-inline:10px;overflow:hidden}
.app.collapsed .side .nl,.app.collapsed .side .logo span,.app.collapsed .side .sf-txt,.app.collapsed .side .pin span{display:none}
.app.collapsed .side .logo img{width:34px;height:35px;object-fit:cover;object-position:left center}
.app.collapsed .side .logo{padding:0 5px}
.app.collapsed .side .nav button{justify-content:center;padding:10px 0;position:relative}
.app.collapsed .side .nav .count{position:absolute;top:4px;right:6px;padding:0 5px;font-size:10px}
.app.collapsed .side.peek{position:fixed;left:0;top:0;bottom:0;width:220px;padding-inline:14px;z-index:50;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.app.collapsed .side.peek .nl,.app.collapsed .side.peek .logo span,.app.collapsed .side.peek .sf-txt,.app.collapsed .side.peek .pin span{display:inline}
.app.collapsed .side.peek .logo img{width:auto;object-fit:initial}
.app.collapsed .side.peek .nav button{justify-content:flex-start;padding:10px 12px}
.app.collapsed .side.peek .nav .count{position:static;margin-left:auto}
.pin{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:0;color:inherit;border-radius:8px;padding:8px 10px;font-size:12px;width:100%;opacity:.9}
.pin:hover{background:rgba(255,255,255,.15)}
.pin svg{width:16px;height:16px;flex:none}
.app.collapsed .side:not(.peek) .pin{justify-content:center;padding:8px 0}
.side-foot{display:flex;flex-direction:column;gap:10px}
.side{background:var(--brand);color:var(--brand-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:flex-end;gap:10px;padding:0 8px}
.logo img{display:block;height:35px;width:auto}
.mtop{display:none}
.logo-g{filter:var(--logo-f)}
.logo span{font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;opacity:.78;padding:10px 12px;border-radius:9px;text-align:left;font-weight:500}
.nav button:hover{opacity:1;background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.13)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:11px;padding:0}
.side-foot .sf-txt{opacity:.6;padding:0 8px}
.main{min-width:0;padding-inline:28px;padding-block:22px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dlg{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dlg span{margin-right:2px}
.busy{position:fixed;inset:0;background:rgba(5,20,18,.25);z-index:70;display:grid;place-items:center}
.busy div{background:var(--surface);padding:14px 20px;border-radius:12px;box-shadow:var(--shadow);font-size:14px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;line-height:1.6}
.chip.directo{background:var(--directo-soft);color:var(--directo)}
.chip.vendedor{background:var(--vendedor-soft);color:var(--vendedor)}
.chip.partner{background:var(--partner-soft);color:var(--partner)}
.chip.plain{background:var(--surface-2);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.input,.select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;font-size:13px;width:100%}
.select{width:auto}
textarea{resize:vertical;min-height:64px}
.search{max-width:240px}

/* Inicio */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}
.goalp{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;display:flex;flex-direction:column;gap:14px}
.goalp .gh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.goalp h2{margin:0;font-size:16px;font-weight:600}
.goalp .gs{font-size:12px;color:var(--muted);margin-top:2px}
.goalp .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.gbar-wrap{display:flex;flex-direction:column;gap:6px}
.gbar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.gbar{position:relative;height:22px;border-radius:7px;background:var(--surface-2);overflow:visible}
.gbar i{position:absolute;top:0;bottom:0;left:0;border-radius:7px}
.gbar .p{background:var(--accent);opacity:.25}
.gbar .c{background:var(--accent)}
.gbar .exp{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.gbar .exp span{position:absolute;top:calc(100% + 5px);transform:translateX(-50%);font-size:11px;white-space:nowrap;font-weight:600}
.gbar-wrap.has-exp{padding-bottom:18px}
.gbar .c{background:var(--accent)}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.ghead>b{font-size:30px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.gtag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.gtag.good{background:var(--ok-soft);color:var(--ok)}.gtag.behind{background:var(--bad-soft);color:var(--bad)}
.glegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.c{background:var(--accent)}.sw.p{background:var(--accent);opacity:.25}.sw.line{width:2px;height:14px;background:var(--ink);border-radius:1px}
.gstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gstats div{display:flex;flex-direction:column;gap:2px;font-size:12px}
.gstats div span{color:var(--muted)}
.gstats b{font-size:20px;font-weight:600;letter-spacing:-.01em}
.gstats .good{color:var(--ok)!important;font-weight:600}.gstats .behind{color:var(--bad)!important;font-weight:600}
.gform{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end;background:var(--surface-2);border-radius:10px;padding:12px}
.kpi .d .goalref{opacity:.85}
.goal-set{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.grid2>*,.stack>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h2{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--ink);letter-spacing:-.01em}
.panel.fold{padding:0}
.fold-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:16px 18px;cursor:pointer;border-radius:var(--radius)}
.fold-h:hover{background:var(--surface-2)}
.fold-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fold-h .ft{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.fold-h .fs{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fold-h .fs b{color:var(--ink-2);font-weight:600}
.fold-h .chv{color:var(--muted);flex:none;transition:transform .15s}
.fold.open .fold-h .chv{transform:rotate(90deg)}
.fold.open .fold-h{border-radius:var(--radius) var(--radius) 0 0}
.fold-b{padding:4px 18px 18px}
.fold:not(.open) .fold-b{display:none}
.fold-b .hint{margin-top:0}
.stiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stile:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.stile[aria-disabled="true"]{opacity:.5;cursor:default;box-shadow:none}
.stile b{font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.stile span{font-size:12px;color:var(--ink-2);font-weight:500}
.stack.gap{gap:12px}
table.simple td,table.simple th{padding:10px}
table.simple tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line-2)}
.subh{font-size:14px;font-weight:700;color:var(--ink);margin:18px 0 4px}
.cvrow{display:grid;grid-template-columns:170px 240px 1fr;gap:12px;align-items:center}
.cvb{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:10px;padding:12px 16px}
.cvb span{font-size:12px;color:var(--ink-2);font-weight:600}
.cvb b{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.cvb em{font-style:normal;font-size:11.5px;color:var(--muted)}
.cvtrack{padding:0 8px}
.cvt{position:relative;height:14px;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.cvt i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.cvm{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.cvl{position:relative;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;height:16px}
.cvl .cvml{position:absolute;transform:translateX(-50%);font-weight:600;color:var(--ink-2);white-space:nowrap}
.cvl .cvml.h{top:16px;font-weight:500;color:var(--muted)}
.cvh{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--muted)}
.cvnote{font-size:11.5px;color:var(--ink-2);margin-top:6px}
@media (max-width:1100px){.cvrow{grid-template-columns:1fr 1fr}.cvtrack{grid-column:1/-1}}@media (max-width:700px){.cvrow{grid-template-columns:1fr}}
.mbar{display:inline-block;width:90px;height:6px;border-radius:99px;background:var(--surface-2);margin-right:10px;vertical-align:middle;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px}
.panel .hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:14px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sub td{color:var(--ink-2);font-size:13px}
tr.sub td:first-child{padding-left:50px}
tr.chx{cursor:pointer}tr.chx:hover td{background:var(--surface-2)}
.chv{vertical-align:-2px;margin-right:8px;color:var(--muted);transition:transform .15s}tr.chx.open .chv{transform:rotate(90deg)}.chv-sp{display:inline-block;width:22px}
tr.total td{font-weight:600;border-bottom:0}
.funnel{display:flex;flex-direction:column;gap:10px}
.pie{margin:4px 0 16px}.pie-tabs{margin-bottom:12px}.pie-tabs button{padding:5px 10px;font-size:12px}
.pie-body{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pseg{transition:stroke-width .15s;cursor:default}.pseg:hover{stroke-width:30}
.pc-v{font-size:17px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}.pc-l{font-size:11px;fill:var(--muted)}
.pie-leg{display:flex;flex-direction:column;flex:1;min-width:0;max-width:560px}
.pl{display:grid;grid-template-columns:10px minmax(64px,1fr) 50px 90px 104px;align-items:center;column-gap:14px;font-size:13px;color:var(--ink-2);padding:9px 4px;border-bottom:1px solid var(--line)}
.pl b{color:var(--ink);text-align:right;font-weight:600}
.pl .pn{color:var(--ink);font-weight:500}
.pl .pv{color:var(--ink-2);text-align:right}
.pl .pu{text-align:right;color:var(--ink);font-weight:600;white-space:nowrap}
.pl .pz{color:var(--line-2);font-weight:400}
.pl.ph{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-top:0;border-bottom:1px solid var(--line-2)}
.pl.ph span{color:var(--muted)}
.pl.ph .r{text-align:right}
.pl.pt{border-bottom:0;border-top:1px solid var(--line-2);margin-top:-1px}
.pl.pt .pn{font-weight:700}
.pl.pt .pv{color:var(--ink);font-weight:600}
.sw2{width:10px;height:10px;border-radius:3px}
.frow.cyc{grid-template-columns:190px 1fr 150px}
td.num,th.num{white-space:nowrap}
table.clickable tbody tr,.panel tr[data-open]{cursor:pointer}
.panel tr[data-open]:hover td{background:var(--surface-2)}
.frow{display:grid;grid-template-columns:124px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.ftrack{height:22px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden}
.ftrack .pot{position:absolute;inset:0 auto 0 0;border-radius:6px;opacity:.35}
.ftrack .cl{position:absolute;inset:0 auto 0 0;border-radius:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.todo{display:flex;flex-direction:column}
.todo button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo button:hover{background:var(--surface-2)}
.todo button:last-child{border-bottom:0}
.todo .t{font-size:13px;min-width:0}
.todo .t b{display:block;font-weight:600}
.todo .t span{color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:13px;padding:14px 0}

/* Estado de seguimiento */
.fu{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.fu.overdue{background:var(--bad-soft);color:var(--bad)}
.fu.today,.fu.week{background:var(--warn-soft);color:var(--warn)}
.fu.later{background:var(--ok-soft);color:var(--ok)}
.fu.none,.fu.nodate{background:var(--surface-2);color:var(--muted)}

/* Pipeline */
.board-wrap{overflow-x:auto;padding-bottom:10px;margin-inline:-4px;padding-inline:4px}
.board{display:grid;grid-template-columns:repeat(var(--n,6),minmax(146px,1fr));gap:8px}
.board .col-h{padding:10px 10px 8px}
.board .col-h .n{font-size:13px}
.board .col-h .m{font-size:11px}
.board .col-h .pc{font-size:11px;margin-top:6px}
.board .col-b{padding:4px 6px 8px}
.board .card .nm{font-size:12.5px!important}
.board .card .row1{font-size:11px}
.board .card .row1 .chip{font-size:10px;padding:1px 6px}
.board .card .row1 .ha b{font-size:12px}
.col{background:var(--surface-2);border-radius:var(--radius);display:flex;flex-direction:column;min-height:300px}
.col-h{padding:12px 12px 10px;border-top:4px solid var(--c);border-radius:var(--radius) var(--radius) 0 0}
.col-h .n{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.col-h .n em{font-style:normal;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink-2);padding:0 8px;border-radius:99px}
.col-h .m{font-size:12px;color:var(--muted);margin-top:2px}
.col-h .pc{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink)}
.col-h .pc .bar{flex:1;height:6px;background:var(--surface)}
.flabel{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.col-b{padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.col-b.over{background:var(--accent-soft);border-radius:0 0 var(--radius) var(--radius)}
.add{border:1px dashed var(--line-2);background:none;border-radius:10px;padding:8px;color:var(--muted);font-size:12px}
.add:hover{color:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 11px;display:flex;flex-direction:column;gap:5px;cursor:grab;box-shadow:0 1px 1px rgba(0,46,43,.04);text-align:left;width:100%}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card .h{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.card .chips{display:flex;gap:4px;flex-wrap:wrap}
.card .h{align-items:center!important}
.card .nm{font-size:13px!important;flex:1;min-width:0}
.card .chip.rv{background:var(--bad-soft);color:var(--bad);font-size:10px;padding:0 6px}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-2);padding-right:4px}
.card .row1 .chip{display:inline-block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.card .row1 .ha{white-space:nowrap;flex:none}
.card .row1 .ha b{font-size:12.5px;color:var(--ink);font-weight:600}
.card .exp{display:inline-flex;align-items:center;gap:3px;border:0;background:none;color:var(--muted);padding:2px 3px;border-radius:6px;flex:none}
.card .exp:hover{background:var(--surface-2);color:var(--ink)}
.card .exp svg{transition:transform .15s}
.card.open .exp svg{transform:rotate(90deg)}
.fdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line-2)}
.fdot.overdue{background:var(--bad)}.fdot.today,.fdot.week{background:var(--warn)}.fdot.later{background:var(--ok)}
.card .next .sv{font-size:11px;color:var(--muted)}
.card .next{padding-top:6px!important}
.card .cc{font-size:11px;color:var(--muted);font-weight:600}
.card .ha{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-2)}
.card .ha b{font-size:15px;color:var(--ink);font-weight:600}
.card .mini{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.card .mini i{display:block;height:100%;background:var(--accent)}
.card .next{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.card .next .txt{color:var(--ink);line-height:1.35}
.card .next .txt.none{color:var(--muted);font-style:italic}
.card .next .row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .last{color:var(--muted);font-size:11px}
.card .last.stale{color:var(--bad)}
.drop-mark{height:3px;background:var(--accent);border-radius:3px;margin:-2px 0}

/* Clientes */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.table-wrap table{min-width:960px}
.table-wrap th{cursor:pointer;user-select:none;background:var(--surface)}
.table-wrap th[aria-sort] .ar{opacity:1}
.table-wrap th .ar{opacity:.3;font-size:10px}
.table-wrap tbody tr{cursor:pointer}
.table-wrap tbody tr:hover td{background:var(--surface-2)}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.lost{opacity:.55}

/* Seguimiento */
.groups{display:flex;flex-direction:column;gap:18px}
.group h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.group h3 em{font-style:normal;color:var(--muted);font-weight:500}
.fl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fl-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.fl-row:last-child{border-bottom:0}
.fl-row .who{min-width:0}
.fl-row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fl-row .who b:hover{color:var(--accent)}
.fl-row .who span{font-size:12px;color:var(--muted)}
.fl-row .what{min-width:0;font-size:13px}
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed .it:last-child{border-bottom:0}
.feed .it .dd{color:var(--muted);font-size:12px}
.feed .it b{cursor:pointer}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;flex-direction:column;gap:12px}
.dr-h .t{display:flex;align-items:flex-start;gap:10px}
.dr-h .t input{font-size:19px;font-weight:600;border:0;background:none;padding:2px 0;flex:1;min-width:0;border-bottom:1px dashed transparent}
.dr-h .t input:hover,.dr-h .t input:focus{border-bottom-color:var(--line-2);outline:none}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.exitc{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px}
.exitc b{color:var(--ink);font-weight:600}
.steps button{border:0;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;padding:7px 2px;border-radius:6px}
.steps button.done{background:var(--accent-soft);color:var(--accent)}
.steps button.cur{background:var(--accent);color:#fff}
.dr-b{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sec.cl{padding:0;gap:0}
.sec-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;cursor:pointer;border-radius:var(--radius)}
.sec-h:hover{background:var(--surface-2)}
.sec-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sec-h .st{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.sec-h .ss{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sec-h .ss b{color:var(--ink-2);font-weight:600}
.sec-h .chv{color:var(--muted);flex:none;transition:transform .15s}
.sec.cl.open .sec-h .chv{transform:rotate(90deg)}
.sec.cl.open .sec-h{border-radius:var(--radius) var(--radius) 0 0}
.sec-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sec.cl:not(.open) .sec-b{display:none}
.drawer .f label,.drawer .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.drawer .f .help{font-size:11px;color:var(--muted)}
.drawer .sec-b .input,.drawer .sec-b textarea{background:var(--surface-2);border-color:transparent;font-size:13.5px;color:var(--ink)}
.drawer .sec-b .input:hover,.drawer .sec-b textarea:hover{border-color:var(--line-2)}
.drawer .sec-b .input:focus,.drawer .sec-b textarea:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.drawer .sec-b .input::placeholder,.drawer .sec-b textarea::placeholder{color:var(--muted);opacity:.8}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:112px minmax(0,1fr) 136px 34px 20px;gap:6px;align-items:center}
.act .input.od{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-soft)}
.act .btn.ok{padding:6px 0;justify-content:center;color:var(--ok)}
.act .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0}
.act .x:hover{color:var(--bad)}
.tl .e.edit{background:var(--surface-2);border-radius:10px;padding:10px;margin:4px 0;border-bottom:0}
.le{display:flex;flex-direction:column;gap:8px}
.le-row{display:flex;gap:8px;flex-wrap:wrap}
.le-row .input{width:auto;flex:1}
.drawer .tl .e.edit .input,.drawer .tl .e.edit textarea{background:var(--surface)}
.eact{display:flex;gap:2px;align-items:flex-start}
.tl .e .x.ed{font-size:13px}
.card .ctry{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.chip.pot{background:none!important;border:1px dashed currentColor;padding:1px 7px}
.more{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.armed{background:var(--bad)!important;color:#fff!important;border-radius:6px!important;font-size:11.5px!important;font-weight:600!important;padding:3px 8px!important;white-space:nowrap;width:auto!important;border:0!important}
/* Selectores de la ficha: la opción elegida con color propio */
.drawer .seg{background:var(--surface-2);padding:4px;gap:4px}
.drawer .seg button{--sc:var(--accent);--ss:var(--accent-soft);border:1px solid transparent}
.drawer .seg button:hover:not([aria-pressed="true"]):not(:disabled){background:var(--surface);color:var(--ink)}
.drawer .seg button[data-dch="vendedor"],.drawer .seg button[data-dpt="pvendedor"]{--sc:var(--vendedor);--ss:var(--vendedor-soft)}
.drawer .seg button[data-dch="partner"],.drawer .seg button[data-dpt="ppartner"]{--sc:var(--partner);--ss:var(--partner-soft)}
.drawer .seg button[aria-pressed="true"]{background:var(--ss);color:var(--sc);border-color:color-mix(in srgb,var(--sc) 45%,transparent);box-shadow:none;font-weight:600}
:root[data-theme="dark"] .drawer .seg button[aria-pressed="true"]{background:var(--ss);color:var(--sc);border-color:var(--sc);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .drawer .seg button[aria-pressed="true"]{background:var(--ss);color:var(--sc);border-color:var(--sc);box-shadow:none}}
.sec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sec.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f .help{font-size:11px;color:var(--muted)}
.f.full{grid-column:1/-1}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.calc div{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.calc b{font-size:15px;color:var(--ink);font-weight:600}
.tl{display:flex;flex-direction:column;gap:0}
.tl .e .ic.min{background:var(--partner)}
details.minuta{margin-top:6px;font-size:12px}
details.minuta summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
details.minuta summary::-webkit-details-marker{display:none}
details.minuta summary::before{content:'▸ '}
details.minuta[open] summary::before{content:'▾ '}
details.minuta .mbody{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:6px 0;max-height:360px;overflow:auto;font-size:12.5px;line-height:1.5;color:var(--ink)}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .dtype{font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);padding:2px 8px;border-radius:99px}
.doc .dname{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dname:hover{color:var(--accent)}
.doc .dmeta{font-size:11px;color:var(--muted);white-space:nowrap}
.doc .x{border:0;background:none;color:var(--muted);font-size:16px}
.doc .x:hover{color:var(--bad)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl .input{width:auto}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center}
.hrow .x{border:0;background:none;color:var(--muted);font-size:16px}
.hrow .x:hover{color:var(--bad)}
.tl .e{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl .e:last-child{border-bottom:0}
.tl .e .ic{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.tl .e .ic.sys{background:var(--line-2)}
.tl .e .meta{font-size:11px;color:var(--muted)}
.tl .e .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.tl .e .x:hover{color:var(--bad)}
.logform{display:grid;grid-template-columns:130px 140px 1fr;gap:8px}
.logform textarea{grid-column:1/-1;min-height:54px}
.logform .btn{grid-column:1/-1;justify-content:center}
.logform #l-min{grid-column:auto}
.dr-f{background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-f .grow{flex:1}

/* Ajustes */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;justify-content:start;grid-template-columns:minmax(180px,360px) 150px 90px 120px 130px;gap:8px 10px;align-items:center}
.prow .cc{display:contents}
.prow .cv{text-align:right}
.prow .cu{font-size:12px;color:var(--ink-2);white-space:nowrap}
.prow.head .r{text-align:right}
.pact{display:flex;gap:4px;justify-content:flex-end}
.pact .btn.primary{width:100%;justify-content:center}
.pgroup{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--kc);border-radius:10px;background:var(--kbg);padding:10px 12px 12px}
.pgroup.k-partner{--kc:var(--partner);--kbg:color-mix(in srgb,var(--partner-soft) 45%,transparent)}
.pgroup.k-vendedor{--kc:var(--vendedor);--kbg:color-mix(in srgb,var(--vendedor-soft) 45%,transparent)}
.pgh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-bottom:4px}
.pgh .chip{font-size:12px;padding:3px 10px}
.pgh .num{font-weight:600;color:var(--ink-2)}
.pgh .pgn{margin-left:auto}
.prow.k-partner select{color:var(--partner);font-weight:600}
.prow.k-vendedor select{color:var(--vendedor);font-weight:600}
.prow.newrow{margin-top:4px;padding-top:12px;border-top:1px dashed var(--line-2)}
.plist{gap:12px}
.plist .prow.head{padding-inline:16px 12px}
.cond{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.cond span{white-space:nowrap}
.cond .input{width:66px;flex:none;padding-inline:8px}
.cond b{font-weight:600;color:var(--ink);white-space:nowrap}
.prow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers div{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.tiers b{display:block;font-size:17px;color:var(--ink)}
.import-prev{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
ol.steps-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.mnav{display:none}

@media (max-width:1100px){.stiles{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.gform{grid-template-columns:repeat(2,minmax(0,1fr))}.gstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .app>.main{grid-column:1}
  .mtop{display:flex;align-items:flex-end;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
  .mtop img{height:30px;width:auto;display:block}
  .mtop span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-bottom:3px}
  .main{padding-inline:16px;padding-block:16px 96px}
  .mnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--brand);color:var(--brand-ink);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{background:none;border:0;color:inherit;opacity:.7;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px 0}
  .mnav button[aria-current="page"]{opacity:1}
  .mnav .nl{font-size:0}
  .mnav .nl::after{content:attr(data-short);font-size:10px}
  .mnav svg{width:20px;height:20px}
  .kpi .v{font-size:22px}
  .board{grid-template-columns:repeat(var(--n,6),82vw);min-width:0}
  .gform{grid-template-columns:1fr}
  .gstats b{font-size:17px}
  .board-wrap{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .fl-row{grid-template-columns:1fr auto;gap:8px}
  .fl-row .who,.fl-row .what{grid-column:1/-1}
  .fl-row .fu{justify-self:start}
  .mnav .count{display:none}
  .fg{grid-template-columns:1fr}
  .logform{grid-template-columns:1fr 1fr}
  .act{grid-template-columns:1fr 1fr 34px 20px}.act [id^="na-txt-"]{grid-column:1/-1;order:-1}
  .prow{grid-template-columns:1fr 1fr}
  .prow .cc{display:flex;align-items:center;gap:8px}
  .prow .cv{width:84px}
  .prow.head{display:none}
  .tiers{grid-template-columns:repeat(2,1fr)}
  .frow{grid-template-columns:110px 1fr;}
  .frow.cyc{grid-template-columns:1fr}
  .hrow{grid-template-columns:1fr 140px auto}
  .frow .fv{grid-column:2}
  .search{max-width:none;flex:1}
}
.rep-wrap{position:fixed;left:-12000px;top:0;z-index:-1}
.rep{width:860px;background:#FFFFFF;color:#0E2523;font-family:var(--font);padding:30px 38px 22px;display:flex;flex-direction:column;gap:11px;font-size:12px;line-height:1.38}
.rep .rh{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid #002E2B;padding-bottom:12px}
.rep .rh img{height:30px;width:auto;display:block;filter:none}
.rep .r1{font-size:18px;font-weight:700;letter-spacing:-.01em;color:#002E2B}
.rep .r2{font-size:11px;color:#6B7F7C}
.rep .rkp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rep .rk{border:1px solid #DCE5E3;border-radius:10px;padding:10px 12px}
.rep .rl{font-size:10.5px;color:#6B7F7C;font-weight:600}
.rep .rv{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.rep .rv small{font-size:11px;font-weight:500;color:#6B7F7C;margin-left:3px}
.rep .rd{font-size:10.5px;color:#3F5552;margin-top:2px}
.rep .rbox{border:1px solid #DCE5E3;border-radius:10px;padding:12px 14px}
.rep .rbt{font-size:13px;font-weight:700;color:#0E2523;margin-bottom:8px}
.rep .rgb{position:relative;height:16px;border-radius:6px;background:#EEF3F2}
.rep .rgb i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.rep .rgb .p{background:#BFE6E1}.rep .rgb .c{background:#12A195}
.rep .rgb .rx{position:absolute;top:-4px;bottom:-4px;width:2px;background:#0E2523}
.rep .rgl{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:#3F5552;margin-top:8px}
.rep .rgl span{display:inline-flex;align-items:center;gap:5px}
.rep .sw{display:inline-block;width:10px;height:10px;border-radius:3px}.rep .sw.c{background:#12A195}.rep .sw.p{background:#BFE6E1}.rep .sw.l{width:2px;height:12px;background:#0E2523}
.rep .r2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep .rmix{display:flex;align-items:center;gap:14px}
.rep .rtb{width:100%;border-collapse:collapse;font-size:11px}
.rep .rtb th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#6B7F7C;text-align:left;padding:4px 6px;border-bottom:1px solid #DCE5E3;font-weight:600}
.rep .rtb td{padding:3.5px 6px;border-bottom:1px solid #EEF3F2;color:#0E2523}
.rep .rtb .r{text-align:right;font-variant-numeric:tabular-nums}
.rep .rdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.rep .rins{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:#0E2523}
.rep .rins b{color:#002E2B}
.rep .rf{font-size:9.5px;color:#6B7F7C;border-top:1px solid #DCE5E3;padding-top:8px}
.fbtn,.mlist,.mstages{display:none}
@media (max-width:760px){.dk{display:none}}
.fcount{background:var(--accent);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;font-weight:700}
@media (max-width:760px){
  .fbtn{display:inline-flex;margin:-4px 0 12px}
  .main{padding-bottom:150px}
  .filters:not(.open){display:none}
  .filters .select,.filters .search{flex:1 1 45%;min-width:0}
  .top{gap:8px;margin-bottom:14px}
  .top h1{font-size:20px}
  .top .sub{font-size:12px}
  .top .grow{display:none}
  .top>div:first-child{flex-basis:100%}
  #x-png{display:none}
  .top .btn.primary[data-new]{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;border-radius:99px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,46,43,.3)}
  .kpis{gap:10px}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:19px;white-space:nowrap}
  .kpi .l{font-size:11.5px}
  .goalp{padding:16px}
  .ghead>b{font-size:24px}
  .panel{padding:14px}
  .panel h2,.fold-h .ft{font-size:15px}
  .pie-body{flex-direction:column;align-items:stretch;gap:12px}
  .pie-body svg{align-self:center}
  .pie-tabs{display:flex;width:100%}.pie-tabs button{flex:1;padding:6px 4px}
  .pie-leg{min-width:0;max-width:none}
  .pl{grid-template-columns:10px 1fr 46px auto;column-gap:10px;row-gap:2px}
  .pl.ph{display:none}
  .pl .pu{grid-column:2/-1;text-align:left;font-size:12px;color:var(--ink-2);font-weight:500}
  .pl.pt .pu{font-weight:700;color:var(--ink)}
  .chtab th:nth-child(2),.chtab td:nth-child(2),.chtab th:nth-child(4),.chtab td:nth-child(4){display:none}
  .chtab td:first-child{white-space:nowrap}
  .chtab td,.chtab th{padding:9px 6px}
  tr.sub td:first-child{padding-left:30px}
  .cvrow{grid-template-columns:1fr 1fr}
  .mbar{display:none}
  table.simple td,table.simple th{padding:9px 6px}
  .fold-h,.sec-h{flex-wrap:wrap;row-gap:2px}
  .fold-h .fs,.sec-h .ss{flex-basis:100%;margin-left:26px;order:3}
  .fold-h{padding:14px}
  .fold-b{padding:4px 14px 14px}
  .stiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stile{padding:10px}.stile b{font-size:22px}.stile span{font-size:11px}
  .mstages{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}
  .mstages::-webkit-scrollbar{display:none}
  .mstages button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;border-top:3px solid var(--c)}
  .mstages button b{background:var(--surface-2);border-radius:99px;padding:0 7px;font-size:11px;color:var(--ink)}
  .mstages button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
  .board{grid-template-columns:repeat(var(--n,6),86vw)}
  .ctable{display:none}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .mcard .mc-h b{font-size:14.5px}
  .mcard .mc-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mcard .mc-r .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .mcard .mc-n{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .mcard .mc-n b{color:var(--ink)}
  .mcard .mc-f{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);min-width:0}
  .mcard .mc-f span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-h{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;gap:10px}
  .dr-h .t input{font-size:17px}
  .steps{grid-template-columns:repeat(4,1fr)}
  .dr-b{padding:12px}
  .dr-f{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .dr-f .grow{flex-basis:100%;height:0}
  .dr-f [data-close].btn,.dr-f #d-save{flex:1;justify-content:center;padding:11px}
  .drawer .sec-b .input,.drawer .sec-b textarea{font-size:16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.mt-out{display:none}
@media (max-width:760px){.mtop{align-items:center}.mt-out{display:inline-flex;align-items:center;gap:5px;margin-left:auto;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:16px}
.login[hidden]{display:none}
.lg-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.lg-card img{width:auto;align-self:flex-start;margin-bottom:6px}
.lg-card h1{font-size:20px;margin:0}
.lg-card p{margin:0 0 8px;color:var(--muted);font-size:13px}
.lg-card label{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:4px}
.lg-card .btn.primary{justify-content:center;margin-top:10px;padding:10px}
.lg-card .btn.ghost{align-self:center}
#lg-msg{font-size:12.5px;color:var(--bad);min-height:18px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
/* ============ Constantes de negocio ============ */
const STAGES=[
  {id:'prospecto',label:'Prospecto',short:'Prospecto',p:10,c:'var(--s1)',exit:'Identificamos al cliente y su superficie aproximada.'},
  {id:'contactado',label:'Contactado',short:'Contactado',p:20,c:'var(--s2)',exit:'Hubo una primera conversación y aceptó conocer BLUM.'},
  {id:'demo',label:'Demo / Diagnóstico',short:'Demo',p:40,c:'var(--s3)',exit:'Le mostramos BLUM y confirmamos hectáreas, necesidad y quién decide.'},
  {id:'propuesta',label:'Propuesta',short:'Propuesta',p:60,c:'var(--s4)',exit:'Enviamos propuesta con hectáreas y precio.'},
  {id:'piloto',label:'Piloto',short:'Piloto',p:75,c:'var(--s5)',exit:'Aceptó probar BLUM en un campo o sector.'},
  {id:'contrato',label:'Contrato',short:'Contrato',p:90,c:'var(--s6)',exit:'Firmó contrato o envió orden de compra.'},
  {id:'activo',label:'Activo',short:'Activo',p:100,c:'var(--s7)',exit:'Plataforma en uso y facturando.'}
];
const STAGE=Object.fromEntries(STAGES.map((s,i)=>[s.id,{...s,i}]));
const EARLY=['prospecto','contactado','demo','propuesta'];
const CHURN='Se dio de baja (era cliente activo)';
const LOST_REASONS=[CHURN,'Precio','Eligió otra solución','No es prioridad / sin presupuesto','Sin respuesta','No califica (superficie o cultivo)','Otro'];
const weighted=c=>c.lost?0:closed(c)+pipe(c)*((STAGE[c.stage]?.p??0)/100);
const CHANNELS={directo:{label:'Directo',c:'var(--directo)'},vendedor:{label:'Vendedor',c:'var(--vendedor)'},partner:{label:'Partner',c:'var(--partner)'}};
const TIERS=[{min:1000,p:9.5,l:'1.000+ ha'},{min:300,p:12,l:'300–999 ha'},{min:100,p:15,l:'100–299 ha'},{min:0,p:25,l:'1–99 ha'}];
const LOG_TYPES=['Reunión','Llamada','Correo','WhatsApp','Visita','Nota'];
const COUNTRIES=['Chile','México','Perú'];
/* País escrito libremente: se ordena para que "chile", "Chile " y "CHILE" cuenten como uno solo */
function cleanCountry(x){const t=String(x||'').trim().replace(/\s+/g,' ');if(!t)return '';const known=[...COUNTRIES,...S.clients.map(c=>c.country)].find(k=>k&&norm(k)===norm(t));return known||t.charAt(0).toUpperCase()+t.slice(1)}
function countryList(){const m={};for(const c of S.clients){const k=norm(c.country);if(!k)continue;(m[k]=m[k]||{name:c.country,n:0}).n++}return Object.values(m).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name))}
const DEFAULT_PARTNER_PRICE=7.5;
const ACT_CATS=['Llamada','Reunión','Correo','WhatsApp','Visita','Propuesta','Tarea'];
const PTYPES={cliente:'Cliente',pvendedor:'Potencial vendedor',ppartner:'Potencial partner'};
const isPot=c=>c.ptype==='pvendedor'||c.ptype==='ppartner';
function actionsOf(c){if(Array.isArray(c.actions))return c.actions;return c.nextAction&&c.nextAction.text?[{id:'na0',cat:'Tarea',text:c.nextAction.text,date:c.nextAction.date||''}]:[]}
const byADate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999');
function firstAction(acts){const a=(acts||[]).filter(x=>x.text).sort(byADate)[0];return a?{text:(a.cat&&a.cat!=='Tarea'?a.cat+': ':'')+a.text,date:a.date||''}:null}
const nActs=c=>actionsOf(c).filter(x=>x.text).length;

/* ============ Estado ============ */
const S={
  clients:[],partners:[],config:{goalHa:13500,avgPrice:null,startDate:'2026-09-01',goalDate:'2027-06-30',baseHa:null},editGoal:false,snaps:[],
  view:'inicio',ready:false,offline:false,
  f:{channel:'all',via:'all',country:'all',stage:'all',ptype:'all',q:'',showLost:false,review:false},
  sort:{k:'haClosed',d:-1},
  drawer:null, chOpen:new Set(), expanded:new Set(), expandAll:false, profiles:{}, me:null, canWrite:true
};
try{const v=localStorage.getItem('blum_view');if(v)S.view=v;}catch(e){}
S.pinned=true;try{S.pinned=localStorage.getItem('blum_side')!=='auto'}catch(e){}
S.folds={};try{S.folds=JSON.parse(localStorage.getItem('blum_folds')||'{}')||{}}catch(e){}
const CHEV='<svg class="chv" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
function fold(id,title,sum,body,def=false){const op=S.folds[id]??def;return `<section class="panel fold ${op?'open':''}" id="fold-${id}"><button type="button" class="fold-h" data-fold="${id}" aria-expanded="${op}">${CHEV}<span class="ft">${title}</span><span class="fs">${sum||''}</span></button><div class="fold-b">${body}</div></section>`}
function setFold(id,op){S.folds[id]=op;try{localStorage.setItem('blum_folds',JSON.stringify(S.folds))}catch(e){}}
(function(){let t=null;const side=()=>document.querySelector('.side');
document.addEventListener('mouseover',e=>{const sd=side();if(!sd||S.pinned||!sd.contains(e.target)||sd.classList.contains('peek')||sd.dataset.hold)return;clearTimeout(t);t=setTimeout(()=>sd.classList.add('peek'),180)});
document.addEventListener('mouseout',e=>{const sd=side();if(!sd||sd.contains(e.relatedTarget))return;clearTimeout(t);sd.classList.remove('peek');delete sd.dataset.hold});
})();

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('es-CL',{maximumFractionDigits:1});
const ha=n=>nf.format(Math.round(n||0));
const usd=n=>'USD '+nf.format(Math.round(n||0));
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const daysFrom=s=>{const d=parseD(s);if(!d)return null;const t=parseD(todayISO());return Math.round((d-t)/86400000)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{const d=parseD(s);return d?`${d.getDate()} ${MES[d.getMonth()]}`:''};
const fdateY=s=>{const d=parseD(s);return d?`${d.getDate()} ${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`:''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function toast(msg){const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}

/* ============ Lógica de negocio ============ */
const partnerById=id=>S.partners.find(p=>p.id===id);
const tierPrice=h=>{for(const t of TIERS)if((h||0)>=t.min)return t.p;return 25};
function priceInfo(c){
  if(Number(c.price)>0)return{p:Number(c.price),src:'manual'};
  if(c.channel==='partner'){const p=partnerById(c.via);return{p:p&&Number(p.price)>0?Number(p.price):DEFAULT_PARTNER_PRICE,src:'partner'}}
  return{p:tierPrice(c.haClosed>0?c.haClosed:c.haPotential),src:'tramo'};
}
/* Ha cerradas cuentan desde Piloto en adelante; en etapas tempranas se tratan como potenciales */
const rawClosed=c=>Number(c.haClosed)||0;
const closed=c=>['prospecto','contactado','demo','propuesta'].includes(c.stage)?0:rawClosed(c);
const potential=c=>Math.max(Number(c.haPotential)||0,rawClosed(c));
const pipe=c=>Math.max(0,potential(c)-closed(c));
const arr=c=>closed(c)*priceInfo(c).p;
const commPct=c=>{if(c.channel!=='vendedor')return 0;if(c.commission!=null&&c.commission!=='')return Number(c.commission)||0;const v=partnerById(c.via);return Number(v?.commission)||0};
const commBase=c=>c.commBaseHa!=null&&c.commBaseHa!==''?Number(c.commBaseHa)||0:closed(c);
const commission=c=>commBase(c)*priceInfo(c).p*commPct(c)/100;
const isClosed=c=>!c.lost&&['contrato','activo'].includes(c.stage);
function commEnd(c){const st=c.startDate||(typeof closeOf==='function'&&closeOf(c)?.d)||'';if(!st)return '';const d=parseD(st);d.setFullYear(d.getFullYear()+1);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
const SURVEY={cliente:'El cliente',blum:'BLUM',partner:'Partner'};
function surveyLabel(c){if(c.channel!=='directo'||!c.survey)return '';if(c.survey==='partner'){const p=partnerById(c.surveyVia);return p?p.name:'Partner (sin elegir)'}return SURVEY[c.survey]||''}
const viaName=c=>{const p=partnerById(c.via);return p?p.name:''};
function lastTouch(c){let m=null;for(const e of c.log||[]){if(e.sys)continue;if(e.d&&(!m||e.d>m))m=e.d}return m}
function fu(c){
  const na=c.nextAction;
  if(!na||!na.text)return{k:'none',l:'Sin próxima acción'};
  if(!na.date)return{k:'nodate',l:'Sin fecha'};
  const d=daysFrom(na.date);
  if(d<0)return{k:'overdue',l:`Vencida · ${fdate(na.date)}`,d};
  if(d===0)return{k:'today',l:'Hoy',d};
  if(d<=7)return{k:'week',l:fdate(na.date),d};
  return{k:'later',l:fdate(na.date),d};
}
const active=()=>S.clients.filter(c=>!c.lost);
function filtered(list,skipStage){
  const f=S.f,q=norm(f.q);
  return list.filter(c=>{
    if(f.channel!=='all'&&c.channel!==f.channel)return false;
    if(f.via!=='all'&&c.via!==f.via)return false;
    if(f.country!=='all'&&norm(c.country)!==norm(f.country))return false;
    if(!skipStage&&f.stage!=='all'&&c.stage!==f.stage)return false;
    if(f.review&&!c.review)return false;
    if(f.ptype!=='all'&&(c.ptype||'cliente')!==f.ptype)return false;
    if(q&&!norm(c.name+' '+(c.contact||'')+' '+viaName(c)+' '+(c.region||'')).includes(q))return false;
    return true;
  });
}
function totals(list){
  const t={n:list.length,closed:0,pot:0,pipe:0,arr:0,byCh:{},byStage:{},byCountry:{}};
  for(const k in CHANNELS)t.byCh[k]={n:0,closed:0,pipe:0,arr:0,parr:0};
  for(const s of STAGES)t.byStage[s.id]={n:0,closed:0,pot:0};
  for(const c of list){
    const cl=closed(c),pp=pipe(c),a=arr(c);
    t.closed+=cl;t.pot+=potential(c);t.pipe+=pp;t.arr+=a;
    const ch=t.byCh[c.channel]||(t.byCh[c.channel]={n:0,closed:0,pipe:0,arr:0,parr:0});ch.n++;ch.closed+=cl;ch.pipe+=pp;ch.arr+=a;ch.parr+=pp*priceInfo(c).p;
    const st=t.byStage[c.stage];if(st){st.n++;st.closed+=cl;st.pot+=potential(c)}
    const co=cleanCountry(c.country)||'Sin país';t.byCountry[co]=(t.byCountry[co]||0)+cl;
  }
  return t;
}
function mostRecentFriday(){const d=parseD(todayISO());const back=(d.getDay()-5+7)%7;d.setDate(d.getDate()-back);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

const MEM={clients:{},partners:{},config:{},snapshots:{}};
function memGet(c,id){return MEM[c][id]}
function memSet(c,id,d){MEM[c][id]=JSON.parse(JSON.stringify(d));memEmit(c)}
function memDel(c,id){delete MEM[c][id];memEmit(c)}
function memEmit(c){ingest(c,Object.entries(MEM[c]).map(([id,d])=>({id,...d})))}
function ingest(col,rows){
  if(col==='clients')S.clients=rows.map(r=>({log:[],...r}));
  else if(col==='partners')S.partners=rows.sort((a,b)=>(a.createdAt||'9999').localeCompare(b.createdAt||'9999')||(a.name||'').localeCompare(b.name||''));
  else if(col==='config'){const m=rows.find(r=>r.id==='main');if(m)S.config={...S.config,...m};const h=rows.find(r=>r.id==='history');S.hist=h&&h.entries?h.entries:{}}
  else if(col==='snapshots')S.snaps=rows.sort((a,b)=>a.id<b.id?-1:1);
  render();
}
function subscribe(col){
  DB.collection(col).onSnapshot(snap=>{
    ingest(col,snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})));
    if(col==='clients'&&!snap.metadata.fromCache){S.ready=true;maybeSnapshot();render()}
    if(col==='snapshots'&&!snap.metadata.fromCache){S.snapsReady=true;maybeSnapshot()}
  },e=>{console.error(col,e);if(e.code==='permission-denied'){toast('Tu usuario no tiene permiso para ver los datos.')}});
}
let snapDone=false;
async function maybeSnapshot(){
  if(snapDone||!DB||!S.ready||!S.snapsReady||!S.canWrite)return;
  const fri=mostRecentFriday();snapDone=true;
  if(S.clients.length===0||S.snaps.find(s=>s.id===fri))return;
  const t=totals(active());
  const byCh={};for(const k in t.byCh)byCh[k]={closed:t.byCh[k].closed,pipe:t.byCh[k].pipe,arr:t.byCh[k].arr};
  const byStage={};for(const k in t.byStage)byStage[k]={n:t.byStage[k].n,pot:t.byStage[k].pot};
  try{await DB.doc('snapshots/'+fri).set({closed:t.closed,pipe:t.pipe,pot:t.pot,arr:t.arr,n:t.n,byCh,byStage,ts:new Date().toISOString()})}catch(e){console.warn(e)}
}
function baseline(){const t=todayISO();const past=S.snaps.filter(s=>s.id<t);return past.length?past[past.length-1]:null}

}

function donut(t){

function goalCalc(t){
  const g=S.config;const goal=Number(g.goalHa)||0;const price=Number(g.avgPrice)||0;
  const base=g.baseHa!=null&&g.baseHa!==''?Number(g.baseHa):0;
  const st=parseD(g.startDate),en=parseD(g.goalDate),now=parseD(todayISO());
  let elapsed=null,monthsLeft=null;
  if(st&&en&&en>st){elapsed=Math.min(1,Math.max(0,(now-st)/(en-st)));monthsLeft=Math.max(0,(en-now)/(86400000*30.44))}
  const expected=elapsed!=null?base+(goal-base)*elapsed:null;
  const missing=Math.max(0,goal-t.closed);
  return{goal,price,base,elapsed,expected,missing,monthsLeft,pace:monthsLeft>0?missing/monthsLeft:null,arrGoal:goal*price,pct:goal?t.closed/goal*100:0,withPipe:goal?(t.closed+t.pipe)/goal*100:0};
}

let dragId=null;
function wireBoard(){
  const bw=$('.board-wrap');if(bw&&!bw.dataset.sync){bw.dataset.sync='1';let tm;bw.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{const cols=[...document.querySelectorAll('.board .col')];let best=0,bd=1e9;cols.forEach((c,i)=>{const d=Math.abs(c.offsetLeft-bw.scrollLeft);if(d<bd){bd=d;best=i}});document.querySelectorAll('.mstages button').forEach((b,i)=>{b.setAttribute('aria-pressed',i===best);if(i===best)b.scrollIntoView({block:'nearest',inline:'nearest'})})},80)},{passive:true})}
  document.querySelectorAll('.card[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');clearMarks();dragId=null});
  });
  document.querySelectorAll('.col-b').forEach(col=>{
    col.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();clearMarks();col.classList.add('over');const after=afterEl(col,e.clientY);const mk=document.createElement('div');mk.className='drop-mark';if(after)col.insertBefore(mk,after);else col.insertBefore(mk,col.querySelector('.add'))});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget)){col.classList.remove('over');col.querySelectorAll('.drop-mark').forEach(x=>x.remove())}});
    col.addEventListener('drop',e=>{e.preventDefault();if(!dragId)return;const after=afterEl(col,e.clientY);const id=dragId;clearMarks();moveCard(id,col.dataset.stage,after?after.dataset.id:null)});
  });
}
function clearMarks(){document.querySelectorAll('.drop-mark').forEach(x=>x.remove());document.querySelectorAll('.col-b.over').forEach(x=>x.classList.remove('over'))}
function afterEl(col,y){const els=[...col.querySelectorAll('.card:not(.dragging)')];for(const el of els){const r=el.getBoundingClientRect();if(y<r.top+r.height/2)return el}return null}
async function moveCard(id,stage,beforeId){
  const c=S.clients.find(x=>x.id===id);if(!c)return;
  const colList=S.clients.filter(x=>!x.lost&&x.stage===stage&&x.id!==id).sort(byRank);
  let rank;
  if(beforeId){const i=colList.findIndex(x=>x.id===beforeId);const next=colList[i];const prev=colList[i-1];rank=prev?((prev.rank??0)+(next.rank??0))/2:(next.rank??0)-1000}
  else rank=colList.length?(colList[colList.length-1].rank??0)+1000:1000;
  const patch={rank,updatedAt:new Date().toISOString()};
  if(c.stage!==stage&&c.channel==='vendedor'&&['contrato','activo'].includes(stage)&&(c.commBaseHa==null||c.commBaseHa==='')&&closed(c)>0)patch.commBaseHa=closed(c);
  if(c.stage!==stage){patch.stageLog=[...(c.stageLog||[]),{s:stage,d:todayISO()}];patch.stage=stage;patch.log=[...(c.log||[]),{id:uid(),d:todayISO(),type:'Etapa',text:`${STAGE[c.stage]?.label||c.stage} → ${STAGE[stage].label}`,sys:true,by:S.me}]}
  Object.assign(c,patch);render();
  await safe(API.update('clients',id,patch),patch.stage?`${c.name} pasó a ${STAGE[stage].label}`:null);
}

/* ---------- Ciclo de ventas ---------- */
const CLOSED_ST=['contrato','activo'];
const dd=(a,b)=>{const x=parseD(a),y=parseD(b);return x&&y?(y-x)/86400000:null};
const wk=n=>n==null?'—':nf1.format(n/7);
function entryOf(c){if(c.entryDate)return c.entryDate;const h=(c.stageLog||[]).filter(x=>x.d).map(x=>x.d).sort()[0];const cr=c.createdAt?String(c.createdAt).slice(0,10):null;return [h,cr].filter(Boolean).sort()[0]||null}
function histOf(c){const h=(c.stageLog||[]).filter(x=>x.d&&STAGE[x.s]).slice().sort((a,b)=>a.d.localeCompare(b.d));const out=[];for(const x of h){if(out.length&&out[out.length-1].s===x.s)continue;out.push(x)}return out}
function closeOf(c){const h=histOf(c).find(x=>CLOSED_ST.includes(x.s));if(h)return{d:h.d,est:false};if(CLOSED_ST.includes(c.stage)&&c.startDate)return{d:c.startDate,est:true};return null}
function cycleStats(list){
  const closedRows=[];const per={};STAGES.forEach(s=>per[s.id]=[]);const open=[];
  for(const c of list){
    const e=entryOf(c),cl=closeOf(c),h=histOf(c);
    const knownEntry=!!c.entryDate||(h.length&&!CLOSED_ST.includes(h[0].s))||(!h.length&&c.createdAt&&!c.importedFrom);
    if(cl&&e&&knownEntry){const days=dd(e,cl.d);if(days!=null&&days>0)closedRows.push({c,e,cl:cl.d,est:cl.est,days})}
    for(let i=0;i<h.length-1;i++){const d=dd(h[i].d,h[i+1].d);if(d!=null&&d>0&&h[i].s!=='activo')per[h[i].s].push(d)}
    if(!c.lost&&!CLOSED_ST.includes(c.stage)){const inStage=h.length&&h[h.length-1].s===c.stage;const last=inStage?h[h.length-1].d:e;open.push({c,since:last,fromEntry:!inStage,days:last?dd(last,todayISO()):null})}
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const med=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
  const days=closedRows.map(r=>r.days);
  return{closedRows:closedRows.sort((a,b)=>b.cl.localeCompare(a.cl)),avg:avg(days),med:med(days),min:days.length?Math.min(...days):null,max:days.length?Math.max(...days):null,per:Object.fromEntries(STAGES.map(s=>[s.id,{avg:avg(per[s.id]),n:per[s.id].length}])),open:open.sort((a,b)=>(b.days??-1)-(a.days??-1)),avgFn:avg};
}
/* Tasa de conversión medida desde una fecha (en hectáreas): ganadas ÷ (ganadas + perdidas).
   Ganada = llegó a Contrato/Activo desde esa fecha (cuentan sus ha cerradas). Perdida = marcada perdida desde esa fecha (ha potenciales). */
const CONV_START_DEF='2026-09-25',CONV_TARGET_DEF=35;
function convSince(ch){
  const st=S.config.convStart||CONV_START_DEF;const target=Number(S.config.convTarget)||CONV_TARGET_DEF;
  const cs=S.clients.filter(c=>!isPot(c)&&(!ch||c.channel===ch));
  const wonAt=c=>(c.stageLog||[]).filter(x=>CLOSED_ST.includes(x.s)&&x.d).map(x=>x.d).sort()[0]||null;
  const won=cs.filter(c=>!c.lost&&CLOSED_ST.includes(c.stage)&&(wonAt(c)||'')>=st).map(c=>({c,d:wonAt(c),h:closed(c)}));
  const lost=cs.filter(c=>c.lost&&(c.lostAt||'')>=st).map(c=>({c,d:c.lostAt,h:potential(c)}));
  const wh=won.reduce((a,x)=>a+x.h,0),lh=lost.reduce((a,x)=>a+x.h,0);
  return{st,target,won,lost,wh,lh,n:won.length+lost.length,rate:wh+lh?wh/(wh+lh)*100:null};
}
/* Tasa histórica desde el ingreso: clientes con fecha de ingreso conocida.
   Ganadas = ha cerradas de clientes en Contrato/Activo. Perdidas = ha potenciales de perdidos (sin contar bajas).
   Sin avanzar = ha potenciales de clientes abiertos que llevan más de N días desde su ingreso sin cerrarse (se consideran no convertidos). */
const CONV_STALE_DEF=120;
function convHist(ch){
  const days=Number(S.config.convStaleDays)||CONV_STALE_DEF;
  const lim=(()=>{const d=parseD(todayISO());d.setDate(d.getDate()-days);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)})();
  const cs=S.clients.filter(c=>!isPot(c)&&c.id!=='ba-baumsystem-agregado'&&c.lostReason!==CHURN&&(!ch||c.channel===ch)&&entryOf(c));
  const won=cs.filter(c=>!c.lost&&CLOSED_ST.includes(c.stage));
  const lost=cs.filter(c=>c.lost);
  const stale=cs.filter(c=>!c.lost&&!CLOSED_ST.includes(c.stage)&&entryOf(c)<lim&&potential(c)>0);
  const open=cs.filter(c=>!c.lost&&!CLOSED_ST.includes(c.stage)&&!stale.includes(c));
  const wh=won.reduce((a,c)=>a+closed(c),0),lh=lost.reduce((a,c)=>a+potential(c),0),sh=stale.reduce((a,c)=>a+potential(c),0);
  const nDec=won.length+lost.length+stale.length;
  return{days,won,lost,stale,open,wh,lh,sh,rate:wh+lh+sh?wh/(wh+lh+sh)*100:null,rateN:nDec?won.length/nDec*100:null,nDec};
}
function convPanel(){

  return `<section class="panel convp"><h2>Tasa de conversión</h2><p class="hint">En hectáreas: ganadas ÷ (ganadas + perdidas + las que llevan más de ${hi.days} días sin cerrarse). Usa la fecha de ingreso de cada cliente y se actualiza sola a medida que avanzan. No considera el historial previo de Baumsystem.</p>
    <div class="cvrow">

function vCiclo(){

/* ---------- Importación ---------- */
const STAGE_MAP={prospecto:'prospecto',contactado:'contactado',demo:'demo',diagnostico:'demo',demodiagnostico:'demo',propuesta:'propuesta',evaluacion:'propuesta',piloto:'piloto',contrato:'contrato',activo:'activo'};
function mapType(t){const n=norm(t);if(n.startsWith('reun'))return 'Reunión';if(n.startsWith('llam'))return 'Llamada';if(n.startsWith('email')||n.startsWith('corr'))return 'Correo';if(n.startsWith('what'))return 'WhatsApp';if(n.startsWith('visit'))return 'Visita';return 'Nota'}
function arrOf(x){if(Array.isArray(x))return x;if(x&&typeof x==='object')return Object.values(x).flat();return[]}
function toLog(list){return arrOf(list).filter(x=>x&&typeof x==='object').map(x=>({id:uid(),d:String(x.date||x.fecha||x.createdAt||'').slice(0,10),type:mapType(x.type||x.tipo||'nota'),text:String(x.description||x.text||x.note||x.notes||x.summary||x.title||x.nota||'').trim(),by:null,imported:true})).filter(e=>e.text)}
function parseOld(raw){
  const get=(side,key,lsKey)=>{if(raw[side]&&raw[side][key]!=null)return raw[side][key];const v=raw[lsKey];if(typeof v==='string'){try{return JSON.parse(v)}catch(e){return null}}return v??null};
  return{
    ba:{statusLog:get('ba','statusLog','ba_baum_statuslog')||{},clients:get('ba','clients','ba_baum_clients')||[],interactions:get('ba','interactions','ba_baum_interactions')||{},meetings:get('ba','meetings','ba_baum_meetings')||{},actions:get('ba','actions','ba_baum_actions')||[]},
    bs:{statusLog:get('bs','statusLog','bs_baum_statuslog')||{},clients:get('bs','clients','bs_baum_clients')||[],interactions:get('bs','interactions','bs_baum_interactions')||{},meetings:get('bs','meetings','bs_baum_meetings')||{},actions:get('bs','actions','bs_baum_actions')||[]}
  };
}
function buildImport(raw){
  const d=parseOld(raw);const rows=[];const bsNames=new Set(d.bs.clients.map(c=>norm(c.name)));
  const bsPartner=S.partners.find(p=>p.kind==='partner'&&norm(p.name)==='baumsystem');const bsId=bsPartner?bsPartner.id:'baumsystem';
  let skipped=0;
  const idCount={ba:{},bs:{}},nameCount={ba:{},bs:{}},namesById={ba:{},bs:{}};
  for(const side of ['ba','bs'])for(const c of d[side].clients){if(!c||c.syncedFrom)continue;const k=String(c.id);idCount[side][k]=(idCount[side][k]||0)+1;(namesById[side][k]=namesById[side][k]||[]).push(String(c.name||'Sin nombre'));const n=norm(c.name);nameCount[side][n]=(nameCount[side][n]||0)+1}
  const usedIds=new Set();
  const mk=(side,c)=>{
    const dupId=idCount[side][String(c.id)]>1;const dupName=nameCount[side][norm(c.name)]>1;
    const review=[];
    if(dupId)review.push(`En el CRM anterior compartía el mismo número interno con: ${namesById[side][String(c.id)].filter(n=>n!==String(c.name)).join(', ')||'otro cliente con el mismo nombre'}. Por eso al abrir una tarjeta podía aparecer otro cliente. Revisa sus datos y su historial.`);
    if(dupName)review.push('Hay otro cliente con el mismo nombre. Revisa si es un duplicado.');
    let docId=side+'-'+c.id;if(dupId)docId=side+'-'+c.id+'-'+(norm(c.name).slice(0,30)||'x');let k=2;while(usedIds.has(docId))docId=docId.replace(/~\d+$/,'')+'~'+(k++);usedIds.add(docId);
    const lost=norm(c.status)==='perdido';
    const stage=STAGE_MAP[norm(c.status)]||'prospecto';
    const type=norm(c.type);
    const b2b=side==='ba'&&(type==='b2b'||type==='distribuidor'||type==='baumsystem');
    const channel=side==='bs'?'partner':(b2b?'partner':'directo');
    if(b2b)review.push(`En el CRM anterior estaba como ${c.type}. Indica si es un partner potencial (agrégalo en Ajustes → Partners) o un cliente que llega por un partner, y elige el partner en la ficha.`);
    let hc=Number(c.hectares)||0;let hp=c.hectaresPotential!=null?Number(c.hectaresPotential)||0:hc;
    if(c.hectaresPotential==null&&EARLY.includes(stage)){hp=hc;hc=0}

    if(dupId)log=log.map(e=>({...e,review:true,text:'[Revisar: puede ser de otro cliente] '+e.text}));
    let next=c.nextAction&&c.nextAction.text?{text:String(c.nextAction.text),date:String(c.nextAction.date||'').slice(0,10)}:null;
    if(!next){const a=arrOf(d[side].actions).find(a=>a&&!a.done&&!a.completed&&norm(a.client)===norm(c.name));if(a)next={text:String(a.title||a.text||''),date:String(a.dueDate||'').slice(0,10)}}
    if(c.notes&&!/cliente ancla/i.test(c.notes))log.unshift({id:uid(),d:String(c.createdAt||c.startDate||'').slice(0,10),type:'Nota',text:'Notas CRM anterior: '+String(c.notes).trim(),by:null,imported:true});
    const price=side==='ba'&&channel==='directo'&&Number(c.pricePerHaYear)>0&&Number(c.pricePerHaYear)!==tierPrice(hc>0?hc:hp)?Number(c.pricePerHaYear):null;
    return{id:docId,warn:review,data:{review:review.length?review.join(' '):null,name:String(c.name||'Sin nombre'),channel,via:channel==='partner'&&!b2b?bsId:null,stage,lost,lostReason:lost?(c.lossReason||c.lostReason||''):'',country:c.country||'',region:c.region||'',crop:c.field||'',contact:c.contactName||'',email:c.email||'',phone:c.phone||'',owner:c.owner||'',haClosed:hc,haPotential:Math.max(hp,hc),price,stageLog:(()=>{const sl=arrOf(d[side].statusLog[c.id]).filter(x=>x&&x.date).map(x=>({s:STAGE_MAP[norm(x.status)]||null,d:String(x.date).slice(0,10)})).filter(x=>x.s).sort((a,b)=>a.d.localeCompare(b.d));const o=[];for(const x of sl){if(o.length&&o[o.length-1].s===x.s)continue;o.push(x)}return dupId?[]:o})(),entryDate:c.createdAt?String(c.createdAt).slice(0,10):'',startDate:c.startDate||'',nextAction:next,log,notes:'',rank:0,createdAt:c.createdAt||null,importedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),importedFrom:side}};
  };
  for(const c of d.ba.clients){
    if(c&&(c.syncedFrom==='baumsystem'||norm(c.name)==='baumsystem')){const h=Number(c.hectares)||0;rows.push({id:'ba-baumsystem-agregado',warn:['Hectáreas activas de los clientes de Baumsystem como un solo total (así estaban en el CRM anterior). Actualiza el número cuando cambie o reemplázalo por los clientes uno a uno.'],data:{review:'Total de hectáreas activas de Baumsystem traído del CRM anterior. Confirma que el número esté al día.',name:'Clientes activos Baumsystem (total)',channel:'partner',via:bsId,stage:'activo',lost:false,lostReason:'',country:'Chile',region:'Nacional',crop:'Varios',contact:'',email:'',phone:'',owner:'',haClosed:h,haPotential:h,price:null,startDate:c.startDate||'',nextAction:null,log:[],notes:'Total de hectáreas activas que Baumsystem gestiona con BLUM.',rank:0,createdAt:null,importedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),importedFrom:'ba'}});continue}
    if(!c||c.syncedFrom||bsNames.has(norm(c.name))){skipped++;continue}rows.push(mk('ba',c))}
  for(const c of d.bs.clients){if(!c)continue;rows.push(mk('bs',c))}
  for(const r of rows){r.exists=!!S.clients.find(x=>x.id===r.id||norm(x.name)===norm(r.data.name));r.include=!r.exists}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}

async function exportBackup(){
  if(!DB){toast('Entra con tu usuario para descargar el respaldo');return}
  const done=busy('Preparando respaldo…');
  try{const out={exportedAt:new Date().toISOString(),by:S.meEmail||''};
    for(const col of ['clients','partners','config','snapshots']){const snap=await DB.collection(col).get();out[col]={};snap.forEach(d=>out[col][d.id]=d.data())}
    done();await saveFile(`BLUM_respaldo_${todayISO()}.json`,new Blob([JSON.stringify(out,null,1)],{type:'application/json'}))}
  catch(e){done();console.error(e);toast('No se pudo preparar el respaldo')}
}
async function restoreBackup(file){
  if(!DB){toast('Entra con tu usuario para restaurar');return}
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('El archivo no es un respaldo válido');return}
  const cols=['clients','partners','config','snapshots','files'].filter(c=>data[c]&&typeof data[c]==='object');
  const n=cols.reduce((a,c)=>a+Object.keys(data[c]).length,0);
  if(!n){toast('El respaldo está vacío');return}
  const exist=S.clients.length;
  const p0=$('#rs-prog');pendingRestore=data;
  if(p0)p0.innerHTML=`<div class="import-prev"><b>Respaldo listo para cargar</b><div>${Object.keys(data.clients||{}).length} clientes · ${Object.keys(data.partners||{}).length} partners y vendedores · ${Object.keys(data.files||{}).length} documentos</div>${exist?`<div style="color:var(--muted)">Ya hay ${exist} clientes: los que tengan el mismo código se reemplazan; los demás se mantienen.</div>`:''}<div style="display:flex;gap:8px;margin-top:6px"><button class="btn primary" data-rsgo="1">Cargar respaldo</button><button class="btn ghost" data-rscancel="1">Cancelar</button></div></div>`;
}
let pendingRestore=null;
async function runRestore(){
  const data=pendingRestore;if(!data)return;pendingRestore=null;
  const cols=['clients','partners','config','snapshots','files'].filter(c=>data[c]&&typeof data[c]==='object');
  const n=cols.reduce((a,c)=>a+Object.keys(data[c]).length,0);
  const p=$('#rs-prog');let k=0;
  try{for(const c of cols){const ids=Object.keys(data[c]);for(let i=0;i<ids.length;i+=400){const b=DB.batch();for(const id of ids.slice(i,i+400)){b.set(DB.doc(c+'/'+id),data[c][id]);k++}await b.commit();if(p)p.textContent=`Cargando ${k} de ${n}…`}}
    if(p)p.textContent=`Listo: ${k} registros cargados.`;toast('Respaldo restaurado')}
  catch(e){console.error(e);if(p)p.textContent='Se detuvo en '+k+' de '+n+'. Vuelve a intentarlo: no se duplican datos.';toast('No se pudo terminar de restaurar')}
}
