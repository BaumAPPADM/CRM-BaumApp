const FIREBASE_CONFIG={"apiKey": "AIzaSyCH7Aa31n_KVC4Z-NtrOmkMsHETmfOmJME", "authDomain": "blum-crm.firebaseapp.com", "projectId": "blum-crm", "storageBucket": "blum-crm.firebasestorage.app", "messagingSenderId": "565679584988", "appId": "1:565679584988:web:b1daa8d1069c36bac46619"};
const FILE_MAX=700*1024;
const dlShim={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return{status:'saved'}}};
function asShim(fdb){return{
  upload:async(blob,opt={})=>{if(blob.size>FILE_MAX)throw{code:'too_large'};const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});const id=uid()+uid();await fdb.doc('files/'+id).set({type:opt.type||blob.type||'application/octet-stream',size:blob.size,data:b64,by:S.me||null,ts:new Date().toISOString()});return{id,sizeBytes:blob.size}},
  delete:async id=>{await fdb.doc('files/'+id).delete()}}}
async function blobOf(id){const d=await DB.doc('files/'+id).get();if(!d.exists)throw new Error('no file');const x=d.data();const bin=atob(x.data||'');const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:x.type})}
async function blobFetch(id){try{return new Response(await blobOf(id))}catch(e){return new Response('',{status:404})}}
async function openBlob(id){const w=window.open('','_blank');try{const b=await blobOf(id);const url=URL.createObjectURL(b);if(w)w.location=url;else location.href=url}catch(e){if(w)w.close();toast('No se pudo abrir el documento')}}
function showLogin(msg){const lg=$('#lg-logo');if(lg&&!lg.src)lg.src=$('.mtop img').src;const el=$('#login');el.hidden=false;if(msg)$('#lg-msg').textContent=msg;setTimeout(()=>$('#lg-email')?.focus(),50)}
function hideLogin(){$('#login').hidden=true}
async function doLogin(){const em=$('#lg-email').value.trim(),pw=$('#lg-pass').value;const m=$('#lg-msg');if(!em||!pw){m.textContent='Escribe tu correo y contraseña.';return}m.textContent='Entrando…';
  try{await firebase.auth().signInWithEmailAndPassword(em,pw);m.textContent=''}catch(e){m.textContent={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Ese correo no tiene acceso. Pide que te creen un usuario.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/invalid-email':'El correo no es válido.','auth/user-disabled':'Este usuario está desactivado.'}[e.code]||'No se pudo entrar. Revisa tu conexión.'}}
async function doReset(){const em=$('#lg-email').value.trim();const m=$('#lg-msg');if(!em){m.textContent='Escribe tu correo y vuelve a presionar “Olvidé mi contraseña”.';return}try{await firebase.auth().sendPasswordResetEmail(em);m.textContent='Te enviamos un correo para crear una nueva contraseña.'}catch(e){m.textContent='No se pudo enviar el correo. Revisa que esté bien escrito.'}}
let fbSubscribed=false;
async function boot(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){loadExamples();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const fdb=firebase.firestore();try{fdb.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await fdb.enablePersistence({synchronizeTabs:true})}catch(e){}
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#login').hidden)doLogin()});
  $('#lg-go').onclick=doLogin;$('#lg-reset').onclick=doReset;
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){hideApp(true);showLogin();return}
    hideLogin();hideApp(false);
    DB=fdb;S.me=u.uid;S.meEmail=u.email;DL=dlShim;AS=asShim(fdb);
    USER={profiles:async ids=>{const out={};await Promise.all(ids.map(async id=>{try{const d=await fdb.doc('users/'+id).get();if(d.exists)out[id]={name:d.data().name||d.data().email}}catch(e){}}));return out}};
    try{await fdb.doc('users/'+u.uid).set({email:u.email,name:u.displayName||(u.email||'').split('@')[0],lastLogin:new Date().toISOString()},{merge:true})}catch(e){}
    if(!fbSubscribed){fbSubscribed=true;['clients','partners','config','snapshots'].forEach(subscribe)}
    render();
  });
}
function hideApp(h){$('#app').style.visibility=h?'hidden':'';$('#mnav').style.visibility=h?'hidden':''}
async function logout(){try{await firebase.auth().signOut()}catch(e){}location.reload()}
boot();
</script>
